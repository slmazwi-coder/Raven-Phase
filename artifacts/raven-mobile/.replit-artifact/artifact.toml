kind = "mobile"
previewPath = "/raven-mobile/"
title = "Raven"
version = "1.0.0"
id = "artifacts/raven-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/raven-mobile/" ]
localPort = 26179

[services.development]
run = "pnpm --filter @workspace/raven-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/raven-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/raven-mobile", "run", "serve" ]

[services.env]
PORT = "26179"
BASE_PATH = "/raven-mobile/"
